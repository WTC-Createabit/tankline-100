<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tankline 100 V3</title><style>
*{box-sizing:border-box}body{margin:0;background:#081522;color:#edf7ff;font:12px system-ui;overflow:hidden}button{font:inherit;font-weight:800;touch-action:manipulation}#app{height:100dvh;max-width:650px;margin:auto;display:flex;flex-direction:column;gap:5px;padding:env(safe-area-inset-top) 7px env(safe-area-inset-bottom)}header{display:flex;justify-content:space-between;align-items:center}header b{font-size:23px;color:#ffd061}header small{display:block;font-size:9px;letter-spacing:1px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.hud div{background:#193140;border:1px solid #5d8396;border-radius:8px;padding:5px 2px;text-align:center;font-weight:900}.hud span{display:block;color:#9fdaf4;font-size:9px}.line{display:flex;justify-content:space-between;font-weight:800}.field{flex:1;min-height:0;position:relative;border:2px solid #64869a;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.counter{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#091c2ae8;padding:5px 9px;border-radius:20px;pointer-events:none;white-space:nowrap}.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.shop button,.row button,.up button,.bottom button,header button{background:#18394c;color:white;border:1px solid #658da3;border-radius:8px;min-height:39px;padding:5px}.shop button.on{border:2px solid #ffd061;background:#624b2a}.shop em{display:block;color:#9cf3ae;font-style:normal}.info{text-align:center;min-height:14px;font-size:10px;color:#c6e1ed}.up{display:grid;grid-template-columns:1fr 1fr;gap:5px}.up button{color:#ffdb95}.up button+button{color:#9de9ff}.row,.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.bottom button{min-height:29px}.overlay{position:fixed;inset:0;background:#020910ec;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.panel{width:min(420px,100%);max-height:85dvh;overflow:auto;background:#173343;border:2px solid #6694ad;border-radius:16px;padding:18px;text-align:center}.panel h1{color:#ffd061}.panel button{display:block;width:100%;padding:12px;margin:7px 0;background:#25536d;color:white;border:1px solid #79a4ba;border-radius:9px}.panel button.primary{background:#eac05b;color:#14222c}.maps{display:grid;grid-template-columns:1fr 1fr;gap:5px}.maps button{font-size:11px}.toast{position:fixed;top:15%;left:50%;transform:translateX(-50%);background:#07131eef;border:1px solid #8bb4ca;padding:8px 12px;border-radius:15px;opacity:0;pointer-events:none;z-index:9}@media(max-height:690px){header small{display:none}.shop button,.row button,.up button{min-height:32px}}
</style></head><body><div id="app"><header><div><b>TANKLINE 100</b><small>DEFEND • UPGRADE • SURVIVE</small></div><button id="menu">☰ MENU</button></header><div class="hud"><div><span>MAP</span><b id="map">1/10</b></div><div><span>WAVE</span><b id="wave">0/50</b></div><div><span>CASH</span><b id="cash">$750</b></div><div><span>BASE</span><b id="hp">20 ♥</b></div></div><div class="line"><span id="zone">RIVER PASS</span><span id="count">ENEMIES 0</span></div><div class="field"><canvas id="board"></canvas><div class="counter" id="timer">NEXT WAVE 8s</div></div><div class="shop" id="shop"></div><div class="info" id="info">Select a tower and tap a build pad.</div><div class="up"><button id="power">⚡ POWER +</button><button id="range">◎ RANGE +</button></div><div class="row"><button id="send">▶ SEND WAVE</button><button id="auto">AUTO ON</button><button id="pause">Ⅱ PAUSE</button></div><div class="bottom"><button id="speed">SPEED 1×</button><button id="sell">SELL</button><button id="save">SAVE NOW</button></div></div><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('board'),g=c.getContext('2d');
const kinds=[['CANNON',100,22,100,.8,'#b6c2cc'],['SNIPER',200,65,160,1.6,'#9de77a'],['MISSILE',300,46,125,1.3,'#ff6864'],['LASER',400,13,116,.18,'#5ccfff'],['PLASMA',500,80,108,1.1,'#bd83ff'],['FLAME',600,15,83,.15,'#ffa448']];
const maps=[['RIVER PASS','#436b3b'],['DESERT RUN','#a88a56'],['CITY SIEGE','#66747a'],['FOREST BEND','#2d583b'],['FROZEN CROSSING','#bdd4d9'],['FACTORY LINE','#676d69'],['NIGHT PATROL','#294258'],['WASTELAND','#80684a'],['FORTRESS ROAD','#4b575c'],['LAST STAND','#464346']];
const routes=[[[0,90],[120,90],[120,210],[290,210],[290,330],[115,330],[115,440],[290,440],[290,545],[400,545]],[[0,110],[95,110],[95,255],[300,255],[300,365],[95,365],[95,530],[400,530]],[[0,70],[310,70],[310,190],[95,190],[95,310],[300,310],[300,430],[135,430],[135,550],[400,550]],[[0,105],[170,105],[170,230],[70,230],[70,350],[320,350],[320,510],[400,510]],[[0,85],[90,85],[90,195],[285,195],[285,315],[105,315],[105,460],[270,460],[270,550],[400,550]],[[0,120],[290,120],[290,230],[130,230],[130,345],[315,345],[315,490],[85,490],[85,560],[400,560]],[[0,90],[190,90],[190,200],[320,200],[320,315],[85,315],[85,435],[250,435],[250,540],[400,540]],[[0,110],[120,110],[120,250],[300,250],[300,375],[165,375],[165,525],[400,525]],[[0,90],[305,90],[305,205],[90,205],[90,320],[285,320],[285,450],[110,450],[110,555],[400,555]],[[0,95],[150,95],[150,215],[305,215],[305,340],[80,340],[80,475],[280,475],[280,545],[400,545]]];
let s={},pads=[],rocks=[],last=0,elapsed=0,modal=true;
const fresh=m=>({m,w:0,cash:750,hp:20,towers:[],enemies:[],queues:[],shots:[],auto:true,paused:false,speed:1,next:8,kind:0,selected:-1,done:false});
function roadDistance(x,y){let best=9999,p=routes[s.m];for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i],dx=b[0]-a[0],dy=b[1]-a[1],u=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));best=Math.min(best,Math.hypot(x-a[0]-u*dx,y-a[1]-u*dy))}return best}
function layout(){pads=[];rocks=[];let seed=179+s.m*71;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let y=48;y<600;y+=57)for(let x=32;x<390;x+=55){let px=x+(rand()-.5)*10,py=y+(rand()-.5)*10;if(roadDistance(px,py)<42||px>350&&py>500)continue;(rand()<.17?rocks:pads).push([px,py])}}
function toast(msg){$('toast').textContent=msg;$('toast').style.opacity=1;clearTimeout(toast.id);toast.id=setTimeout(()=>$('toast').style.opacity=0,1200)}
function panel(html){modal=true;$('overlay').style.display='flex';$('panel').innerHTML=html}function close(){modal=false;$('overlay').style.display='none'}
function save(){try{localStorage.setItem('tankline-v3',JSON.stringify({...s,shots:[],paused:true}))}catch(e){}}
function load(){try{let a=JSON.parse(localStorage.getItem('tankline-v3'));if(!a||!Number.isInteger(a.m)||a.m<0||a.m>9)return false;s={...fresh(a.m),...a,shots:[],selected:-1,paused:true};layout();return true}catch(e){return false}}
function start(m){s=fresh(m);layout();close();ui();save()}
function home(){s.paused=true;save();let has=false;try{has=!!localStorage.getItem('tankline-v3')}catch(e){}panel('<h1>TANKLINE 100 V3</h1><p>10 maps • 50 waves per map • 500 total waves.<br>Pause and upgrade anytime. Saves are local.</p>'+(has?'<button class="primary" id="continue">CONTINUE GAME</button>':'')+'<button id="new">NEW GAME</button><p style="font-size:11px">Standalone HTML works without internet. Keep the same browser to preserve saves.</p>');if(has)$('continue').onclick=()=>{if(load()){close();s.paused=false;ui()}else toast('Save unavailable')};$('new').onclick=choose}
function choose(){panel('<h1>CHOOSE MAP</h1><p>Each map has its own track and restricted build pads.</p><div class="maps">'+maps.map((m,i)=>'<button data-m="'+i+'">'+(i+1)+'. '+m[0]+'</button>').join('')+'</div><button id="back">BACK</button>');$('back').onclick=home;$('panel').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(+b.dataset.m))}
function menu(){s.paused=true;save();panel('<h1>PAUSED</h1><p>Map '+(s.m+1)+' • Wave '+s.w+'/50</p><button class="primary" id="resume">RESUME</button><button id="change">CHANGE MAP</button><button id="restart">RESTART MAP</button><button id="home">MAIN MENU</button>');$('resume').onclick=()=>{close();s.paused=false};$('change').onclick=choose;$('restart').onclick=()=>start(s.m);$('home').onclick=home}
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));g.setTransform(c.width/400,0,0,c.height/620,0,0)}addEventListener('resize',resize);
function damage(t){return kinds[t.k][2]*Math.pow(1.31,t.p-1)}function radius(t){return Math.min(205,kinds[t.k][3]+(t.r-1)*7)}function pc(t){return Math.floor(65*Math.pow(1.23,t.p-1))}function rc(t){return Math.floor(90*Math.pow(1.38,t.r-1))}

function ui(){if(s.m===undefined)return;$('map').textContent=(s.m+1)+'/10';$('wave').textContent=s.w+'/50';$('cash').textContent='$'+Math.floor(s.cash);$('hp').textContent=Math.max(0,s.hp)+' ♥';$('zone').textContent=maps[s.m][0];$('count').textContent='ENEMIES '+(s.enemies.length+s.queues.reduce((n,q)=>n+q.left,0));$('timer').textContent=s.paused?'PAUSED':s.w===50?'ALL WAVES SENT':s.auto?'NEXT WAVE '+Math.ceil(s.next)+'s':'AUTO OFF';$('auto').textContent='AUTO '+(s.auto?'ON':'OFF');$('pause').textContent=s.paused?'▶ RESUME':'Ⅱ PAUSE';$('speed').textContent='SPEED '+s.speed+'×';$('shop').innerHTML=kinds.map((k,i)=>'<button class="'+(s.kind===i?'on':'')+'" data-k="'+i+'">'+k[0]+'<em>$'+k[1]+'</em></button>').join('');$('shop').querySelectorAll('button').forEach(b=>b.onclick=()=>{s.kind=+b.dataset.k;s.selected=-1;ui()});let t=s.towers[s.selected];$('info').textContent=t?kinds[t.k][0]+' • POWER '+t.p+' • RANGE '+t.r+' • DMG '+Math.round(damage(t))+' • RADIUS '+Math.round(radius(t)):'Choose a tower and tap an empty build pad.';$('power').textContent='⚡ POWER + '+(t?'$'+pc(t):'');$('range').textContent='◎ RANGE + '+(t?'$'+rc(t):'');$('power').disabled=!t;$('range').disabled=!t||t.r>=10;$('sell').disabled=!t;$('send').disabled=s.w>=50||s.done}
function send(){if(s.done||s.w>=50)return;s.w++;let n=7+Math.floor(s.w*.58)+s.m*2;s.queues.push({id:s.w,left:n,total:n,clock:0});s.next=9;ui();save()}
function spawn(q){let kind=q.id===50&&q.left===1?'boss':q.id>30&&Math.random()<.2?'heavy':q.id>12&&Math.random()<.27?'fast':'normal',hp=(38+q.id*8)*Math.pow(1.042,q.id-1)*(1+s.m*.32),speed=38+q.id*.42;if(kind==='fast'){hp*=.62;speed*=1.65}if(kind==='heavy'){hp*=3;speed*=.65}if(kind==='boss'){hp*=14;speed*=.48}let p=routes[s.m][0];s.enemies.push({x:p[0],y:p[1],seg:0,u:0,hp,max:hp,speed,kind,id:q.id,reward:12+q.id*.6})}
function move(e,dt){let p=routes[s.m],v=e.speed*dt;while(v>0&&e.seg<p.length-1){let a=p[e.seg],b=p[e.seg+1],len=Math.hypot(b[0]-a[0],b[1]-a[1]),remain=len*(1-e.u);if(v<remain){e.u+=v/len;v=0}else{v-=remain;e.seg++;e.u=0}if(e.seg<p.length-1){a=p[e.seg];b=p[e.seg+1];e.x=a[0]+(b[0]-a[0])*e.u;e.y=a[1]+(b[1]-a[1])*e.u}}if(e.seg===p.length-1){e.dead=true;s.hp-=e.kind==='boss'?5:e.kind==='heavy'?2:1}}
function tick(dt){if(s.done)return;if(s.auto&&s.w<50){s.next-=dt;if(s.next<=0)send()}for(let q of s.queues){q.clock-=dt;if(q.left>0&&q.clock<=0){spawn(q);q.left--;q.clock=Math.max(.22,.85-q.id*.007)}}for(let e of s.enemies)move(e,dt);for(let t of s.towers){t.cd-=dt;if(t.cd>0)continue;let targets=s.enemies.filter(e=>!e.dead&&e.hp>0&&Math.hypot(e.x-t.x,e.y-t.y)<radius(t));targets.sort((a,b)=>(b.seg+b.u)-(a.seg+a.u));let e=targets[0];if(!e)continue;t.angle=Math.atan2(e.y-t.y,e.x-t.x);let dmg=damage(t),splash=t.k===2?32:t.k===4?42:0;e.hp-=dmg;if(splash)for(let o of s.enemies)if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<splash)o.hp-=dmg*.38;s.shots.push({x:t.x,y:t.y,ex:e.x,ey:e.y,color:kinds[t.k][5],life:.14});t.cd=kinds[t.k][4]/Math.min(2.4,1+(t.p-1)*.025)}for(let e of s.enemies)if(e.hp<=0&&!e.dead){e.dead=true;s.cash+=e.reward;s.shots.push({x:e.x-8,y:e.y-8,ex:e.x+8,ey:e.y+8,color:'#ffcc63',life:.24})}s.enemies=s.enemies.filter(e=>!e.dead);for(let sh of s.shots)sh.life-=dt;s.shots=s.shots.filter(sh=>sh.life>0);for(let q of s.queues)if(q.left===0&&!s.enemies.some(e=>e.id===q.id)){q.finished=true;s.cash+=35+q.id*2}s.queues=s.queues.filter(q=>!q.finished);if(s.hp<=0){s.hp=0;s.done=true;s.paused=true;save();panel('<h1>BASE DESTROYED</h1><p>You reached wave '+s.w+' on '+maps[s.m][0]+'.</p><button class="primary" id="retry">TRY AGAIN</button><button id="maps">MAP SELECT</button>');$('retry').onclick=()=>start(s.m);$('maps').onclick=choose}if(s.w===50&&!s.queues.length&&!s.enemies.length&&!s.done){s.done=true;s.paused=true;save();panel('<h1>MAP COMPLETE!</h1><p>You defended '+maps[s.m][0]+' through all 50 waves.</p><button class="primary" id="nextmap">'+(s.m===9?'CHOOSE MAP':'NEXT MAP')+'</button><button id="again">PLAY AGAIN</button>');$('nextmap').onclick=()=>s.m===9?choose():start(s.m+1);$('again').onclick=()=>start(s.m)}}
function pathStroke(color,width){g.strokeStyle=color;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';g.beginPath();routes[s.m].forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.stroke()}
function render(){if(s.m===undefined)return;g.fillStyle=maps[s.m][1];g.fillRect(0,0,400,620);for(let y=0;y<620;y+=34)for(let x=0;x<400;x+=34){g.fillStyle=(x+y)%3===0?'#ffffff08':'#00000008';g.fillRect(x,y,33,33)}for(let [x,y] of rocks){g.fillStyle='#1b3027';g.beginPath();g.arc(x,y,14,0,7);g.fill();g.fillStyle=s.m===4?'#effaff':'#8a8b79';g.beginPath();g.arc(x-3,y-4,10,0,7);g.fill()}pathStroke('#dec798',48);pathStroke('#273039',40);pathStroke('#55575a',34);g.setLineDash([9,13]);pathStroke('#e9d9a6',1.8);g.setLineDash([]);for(let [x,y] of pads){let occupied=s.towers.some(t=>Math.hypot(t.x-x,t.y-y)<8);if(occupied)continue;g.fillStyle='#213c36b8';g.fillRect(x-14,y-14,28,28);g.strokeStyle='#ccecc0';g.lineWidth=2;g.strokeRect(x-14,y-14,28,28);g.strokeStyle='#f2ffe6';g.beginPath();g.moveTo(x-7,y);g.lineTo(x+7,y);g.moveTo(x,y-7);g.lineTo(x,y+7);g.stroke()}g.fillStyle='#401a1a';g.fillRect(0,routes[s.m][0][1]-23,64,45);g.strokeStyle='#ff685b';g.lineWidth=3;g.strokeRect(1,routes[s.m][0][1]-22,62,43);g.fillStyle='white';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('ENEMY',32,routes[s.m][0][1]-4);g.fillText('START',32,routes[s.m][0][1]+13);let ey=routes[s.m].at(-1)[1];g.fillStyle='#113c59';g.fillRect(344,ey-31,55,62);g.strokeStyle='#62dcff';g.lineWidth=3;g.strokeRect(344,ey-31,55,62);g.fillStyle='white';g.fillText('YOUR',371,ey-4);g.fillText('BASE',371,ey+13);let sel=s.towers[s.selected];if(sel){g.fillStyle='#5ee6ff21';g.strokeStyle='#72eaff';g.lineWidth=2;g.beginPath();g.arc(sel.x,sel.y,radius(sel),0,7);g.fill();g.stroke()}for(let t of s.towers){g.save();g.translate(t.x,t.y);g.fillStyle='#101b27';g.fillRect(-17,-14,34,28);g.strokeStyle=t===sel?'#ffcd4c':'#9aa9b5';g.lineWidth=3;g.strokeRect(-17,-14,34,28);g.rotate(t.angle||0);g.fillStyle=kinds[t.k][5];g.fillRect(0,-5,25+Math.min(t.p,12),10);g.fillStyle='#354958';g.beginPath();g.arc(0,0,12+Math.min(5,t.p/3),0,7);g.fill();g.strokeStyle=kinds[t.k][5];g.stroke();g.restore();g.fillStyle='white';g.font='bold 10px system-ui';g.fillText('P'+t.p,t.x,t.y+24)}for(let e of s.enemies){g.save();g.translate(e.x,e.y);let p=routes[s.m],a=p[Math.min(e.seg,p.length-2)],b=p[Math.min(e.seg+1,p.length-1)];g.rotate(Math.atan2(b[1]-a[1],b[0]-a[0]));let z=e.kind==='boss'?18:e.kind==='heavy'?13:10;g.fillStyle=e.kind==='boss'?'#ad3e69':e.kind==='heavy'?'#665f9e':e.kind==='fast'?'#e9a744':'#8eb45a';g.fillRect(-z,-z*.65,z*2,z*1.3);g.fillStyle='#1c2926';g.fillRect(-z*.45,-z*.45,z*.9,z*.9);g.fillStyle='#cadad0';g.fillRect(z*.2,-2,z*.9,4);g.restore();g.fillStyle='#1a1010';g.fillRect(e.x-13,e.y-19,26,4);g.fillStyle='#ff6d5d';g.fillRect(e.x-13,e.y-19,26*Math.max(0,e.hp/e.max),4)}for(let sh of s.shots){g.strokeStyle=sh.color;g.lineWidth=3;g.beginPath();g.moveTo(sh.x,sh.y);g.lineTo(sh.ex,sh.ey);g.stroke()}}
function frame(time){let dt=Math.min(.05,(time-last)/1000||0);last=time;if(!modal&&!s.paused){tick(dt*s.speed);elapsed+=dt;if(elapsed>.18){ui();elapsed=0}}render();requestAnimationFrame(frame)}
c.addEventListener('pointerdown',ev=>{if(modal||s.done)return;let r=c.getBoundingClientRect(),x=(ev.clientX-r.left)*400/r.width,y=(ev.clientY-r.top)*620/r.height;let hit=s.towers.findIndex(t=>Math.hypot(t.x-x,t.y-y)<21);if(hit>=0){s.selected=hit;ui();return}let pad=pads.find(p=>Math.hypot(p[0]-x,p[1]-y)<22);if(!pad){toast('Tap an available build pad');return}if(s.towers.some(t=>Math.hypot(t.x-pad[0],t.y-pad[1])<10)){toast('Pad occupied');return}let k=kinds[s.kind];if(s.cash<k[1]){toast('Not enough cash');return}s.cash-=k[1];s.towers.push({x:pad[0],y:pad[1],k:s.kind,p:1,r:1,cd:0,angle:-Math.PI/2});s.selected=s.towers.length-1;ui();save()});
$('power').onclick=()=>{let t=s.towers[s.selected];if(!t)return;let cost=pc(t);if(s.cash<cost)return toast('Need more cash');s.cash-=cost;t.p++;ui();save()};
$('range').onclick=()=>{let t=s.towers[s.selected];if(!t||t.r>=10)return;let cost=rc(t);if(s.cash<cost)return toast('Need more cash');s.cash-=cost;t.r++;ui();save()};
$('sell').onclick=()=>{let t=s.towers[s.selected];if(!t)return;s.cash+=Math.floor(kinds[t.k][1]*.5);s.towers.splice(s.selected,1);s.selected=-1;ui();save()};
$('send').onclick=()=>{if(!modal)send()};$('auto').onclick=()=>{s.auto=!s.auto;ui();save()};$('speed').onclick=()=>{s.speed=s.speed===1?2:s.speed===2?3:1;ui()};
$('pause').onclick=()=>{s.paused=!s.paused;ui();save()};$('save').onclick=()=>{save();toast('Game saved')};$('menu').onclick=menu;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s.m!==undefined){s.paused=true;save()}});
s=fresh(0);layout();resize();ui();home();requestAnimationFrame(frame);
})();
</script></body></html>
