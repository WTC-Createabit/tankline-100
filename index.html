<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>Tankline 100</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1117;color:#eef4f7;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}#wrap{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:5px 0;font-weight:800;font-size:13px}.pill{background:#17212b;border:1px solid #2c3b48;border-radius:9px;padding:7px;text-align:center}canvas{width:100%;flex:1;min-height:0;background:#101922;border:1px solid #344652;border-radius:12px;touch-action:none}.bar{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;padding-top:7px}button{min-height:48px;border:0;border-radius:11px;font-weight:900;font-size:14px;background:#d7e3e8;color:#10202a}button.sel{outline:3px solid #f3c64d;background:#fff3bd}button:disabled{opacity:.45}.hint{text-align:center;font-size:11px;color:#aebcc5;padding:4px 0 1px}.modal{position:fixed;inset:0;background:#081016e8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:4}.card{max-width:430px;background:#17212b;border:1px solid #425767;border-radius:18px;padding:22px;text-align:center}.card h1{margin:0 0 8px}.card p{line-height:1.4;color:#c8d3da}.card button{width:100%;margin-top:8px;background:#f3c64d}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 12px;border-radius:20px;font-size:12px;pointer-events:none;opacity:0;transition:.2s}
</style></head><body><div id='wrap'><div id='hud'><div class='pill'>LEVEL <span id='lvl'>1</span>/100</div><div class='pill'>CASH $<span id='cash'>260</span></div><div class='pill'>BASE <span id='life'>20</span></div><div class='pill'>WAVE <span id='left'>0</span></div></div><canvas id='c'></canvas><div class='bar'><button id='build' class='sel'>BUILD $80</button><button id='upgrade'>UPGRADE</button><button id='wave'>START WAVE</button></div><div class='hint'>Tap green ground to build • Protect the base • Towers fire automatically</div></div><div id='toast'></div><script>
const C=document.getElementById('c'),x=C.getContext('2d');let W,H,scale=1;
let level=1,cash=260,life=20,enemies=[],towers=[],shots=[],selected=null,mode='build',running=false,spawnN=0,spawnT=0,last=0;
const $=id=>document.getElementById(id);function resize(){let r=C.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);C.width=r.width*d;C.height=r.height*d;x.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}addEventListener('resize',resize);
function pathPoints(){return [[-10,H*.2],[W*.23,H*.2],[W*.23,H*.78],[W*.47,H*.78],[W*.47,H*.2],[W*.70,H*.2],[W*.70,H*.78],[W+20,H*.78]]}function onPath(px,py){const pts=pathPoints();for(let i=0;i<pts.length-1;i++){const [x1,y1]=pts[i],[x2,y2]=pts[i+1];const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=Math.max(0,Math.min(1,t));const qx=x1+t*dx,qy=y1+t*dy;if(Math.hypot(px-qx,py-qy)<38)return true}return false}
function hud(){ $('lvl').textContent=level;$('cash').textContent=Math.floor(cash);$('life').textContent=life;$('left').textContent=enemies.length+spawnN;$('upgrade').textContent=selected?`UPGRADE $${upgradeCost(selected)}`:'UPGRADE';$('wave').disabled=running;$('wave').textContent=running?'WAVE RUNNING':'START WAVE'}
function toast(s){let t=$('toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,900)}
function startGame(){resize();last=performance.now();requestAnimationFrame(loop)}
function tap(id,fn){const el=$(id);el.addEventListener('pointerup',e=>{e.preventDefault();fn()});}
tap('build',()=>{mode='build';selected=null;$('build').classList.add('sel');hud()});tap('upgrade',()=>{if(!selected)return toast('Tap a tower first');let c=upgradeCost(selected);if(cash<c)return toast('Need more cash');cash-=c;selected.lv++;hud()});tap('wave',()=>{if(running)return;running=true;spawnN=7+Math.floor(level*0.45);spawnT=0;hud()});
function upgradeCost(t){return 65+t.lv*45}
C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let hit=towers.find(t=>Math.hypot(t.x-px,t.y-py)<25);if(hit){selected=hit;mode='select';$('build').classList.remove('sel');hud();return}if(mode==='build'){if(onPath(px,py))return toast('Build off the road');if(towers.some(t=>Math.hypot(t.x-px,t.y-py)<42))return toast('Too close');if(cash<80)return toast('Need $80');cash-=80;towers.push({x:px,y:py,lv:1,cd:0});hud()}});
function spawn(){let hp=30*Math.pow(1.027,level-1)*(1+Math.random()*.18);enemies.push({seg:0,t:0,x:-10,y:H*.2,hp,max:hp,spd:42+level*.34,r:11+Math.min(5,level/25),reward:13+level*.12})}
function update(dt){if(running&&spawnN>0){spawnT-=dt;if(spawnT<=0){spawn();spawnN--;spawnT=Math.max(.28,.85-level*.004)}}
 for(let e of enemies){let move=e.spd*dt,pts=pathPoints();while(move>0&&!e.dead){if(e.seg>=pts.length-1){e.dead=true;life--;break}let [x1,y1]=pts[e.seg],[x2,y2]=pts[e.seg+1],len=Math.hypot(x2-x1,y2-y1),remain=len*(1-e.t);if(move<remain){e.t+=move/len;move=0}else{move-=remain;e.seg++;e.t=0;if(e.seg>=pts.length-1){e.dead=true;life--;break}}if(!e.dead){[x1,y1]=pts[e.seg];[x2,y2]=pts[e.seg+1];e.x=x1+(x2-x1)*e.t;e.y=y1+(y2-y1)*e.t}}}
 enemies=enemies.filter(e=>{if(e.dead)return false;if(e.hp<=0){cash+=e.reward;return false}return true});
 for(let t of towers){t.cd-=dt;if(t.cd<=0){let range=88+t.lv*10,target=enemies.filter(e=>Math.hypot(e.x-t.x,e.y-t.y)<range).sort((a,b)=>(b.seg+b.t)-(a.seg+a.t))[0];if(target){shots.push({x:t.x,y:t.y,tx:target.x,ty:target.y,a:.12});target.hp-=12*Math.pow(1.34,t.lv-1);t.cd=Math.max(.16,.68-t.lv*.055)}}}
 for(let s of shots)s.a-=dt;shots=shots.filter(s=>s.a>0);
 if(life<=0){running=false;showEnd(false)}else if(running&&spawnN===0&&enemies.length===0){running=false;if(level>=100)showEnd(true);else{level++;cash+=35+level*2;toast('Level cleared! Bonus cash');hud()}}hud()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#16251d';x.fillRect(0,0,W,H);const pts=pathPoints();x.strokeStyle='#6e6656';x.lineWidth=62;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))x.lineTo(p[0],p[1]);x.stroke();x.strokeStyle='#8b826e';x.lineWidth=3;x.stroke();x.fillStyle='#d8e4d5';x.font='700 12px system-ui';x.textAlign='left';x.fillText('ENTRY',10,H*.2-42);x.textAlign='right';x.fillText('BASE',W-10,H*.78-42);
 for(let t of towers){let R=88+t.lv*10;if(t===selected){x.strokeStyle='#f3c64d55';x.lineWidth=2;x.beginPath();x.arc(t.x,t.y,R,0,7);x.stroke()}x.fillStyle=t===selected?'#f3c64d':'#c9d5db';x.beginPath();x.arc(t.x,t.y,16,0,7);x.fill();x.fillStyle='#24333d';x.fillRect(t.x-4,t.y-24,8,20);x.fillStyle='#111';x.font='10px system-ui';x.textAlign='center';x.fillText(t.lv,t.x,t.y+4)}
 for(let e of enemies){x.fillStyle='#d34c4c';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#111';x.fillRect(e.x-15,e.y-20,30,4);x.fillStyle='#64db75';x.fillRect(e.x-15,e.y-20,30*Math.max(0,e.hp/e.max),4)}for(let s of shots){x.strokeStyle='#ffe36b';x.lineWidth=3;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.tx,s.ty);x.stroke()}}
function loop(ts){let dt=Math.min(.035,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function showEnd(win){let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class='card'><h1>${win?'YOU BEAT ALL 100 LEVELS':'BASE DESTROYED'}</h1><p>You reached level ${level}.</p><button onclick='location.reload()'>PLAY AGAIN</button></div>`;document.body.appendChild(m)}hud();

startGame();
</script></body></html>
