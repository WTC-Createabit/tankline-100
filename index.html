<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tankline 100 — V2</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#071019;
 color:#eef4f7;
 font-family:system-ui,-apple-system,sans-serif;
 overflow:hidden;
 touch-action:none
}

#wrap{
 height:100dvh;
 display:flex;
 flex-direction:column;
 padding:env(safe-area-inset-top) 7px env(safe-area-inset-bottom)
}

#hud{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 padding:5px 0;
 font-weight:900;
 font-size:12px
}

.pill{
 background:linear-gradient(#1b2935,#111c25);
 border:1px solid #3c5262;
 border-radius:9px;
 padding:7px 3px;
 text-align:center;
 box-shadow:0 2px 5px #0007
}

#worldbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:4px 7px 6px;
 font-size:11px;
 font-weight:800;
 color:#c8d5dc
}

#worldName{
 color:#f3c64d
}

canvas{
 width:100%;
 flex:1;
 min-height:0;
 background:#101922;
 border:1px solid #344652;
 border-radius:12px;
 touch-action:none;
 box-shadow:inset 0 0 25px #0008
}

.bar{
 display:grid;
 grid-template-columns:1.1fr 1fr 1.15fr;
 gap:6px;
 padding-top:7px
}

.subbar{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 padding-top:6px
}

button{
 min-height:47px;
 border:1px solid #425767;
 border-radius:11px;
 font-weight:900;
 font-size:13px;
 background:linear-gradient(#e3edf1,#b9cbd3);
 color:#10202a;
 box-shadow:0 3px 0 #071019
}

button:active{
 transform:translateY(2px);
 box-shadow:0 1px 0 #071019
}

button.sel{
 outline:3px solid #f3c64d;
 background:linear-gradient(#fff8cf,#f0d86f)
}

button.autoOn{
 background:linear-gradient(#8de49b,#52b968);
 color:#08230e
}

button.autoOff{
 background:linear-gradient(#e6a0a0,#c75d5d);
 color:#2b0909
}

button:disabled{
 opacity:.5
}

.hint{
 text-align:center;
 font-size:10px;
 color:#9fb0ba;
 padding:4px 0 1px
}

.modal{
 position:fixed;
 inset:0;
 background:#061018ef;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px;
 z-index:5
}

.card{
 width:min(430px,100%);
 background:#17232e;
 border:1px solid #526979;
 border-radius:18px;
 padding:22px;
 text-align:center;
 box-shadow:0 15px 50px #000
}

.card h1{
 margin:0 0 8px;
 color:#f3c64d
}

.card p{
 line-height:1.45;
 color:#c8d3da
}

.card button{
 width:100%;
 margin-top:8px;
 background:#f3c64d
}

#toast{
 position:fixed;
 top:78px;
 left:50%;
 transform:translateX(-50%);
 background:#000d;
 border:1px solid #ffffff22;
 padding:8px 13px;
 border-radius:20px;
 font-size:12px;
 pointer-events:none;
 opacity:0;
 transition:.2s;
 z-index:8;
 white-space:nowrap
}
</style>
</head>

<body>

<div id="wrap">

<div id="hud">
 <div class="pill">LEVEL <span id="lvl">1</span>/100</div>
 <div class="pill">CASH $<span id="cash">300</span></div>
 <div class="pill">BASE <span id="life">20</span></div>
 <div class="pill">ENEMIES <span id="left">0</span></div>
</div>

<div id="worldbar">
 <span>ZONE: <span id="worldName">COUNTRYSIDE</span></span>
 <span>WAVES <span id="waves">0</span></span>
</div>

<canvas id="c"></canvas>

<div class="bar">
 <button id="build" class="sel">BUILD $80</button>
 <button id="upgrade">UPGRADE</button>
 <button id="wave">SEND WAVE</button>
</div>

<div class="subbar">
 <button id="auto" class="autoOn">AUTO WAVES: ON</button>
 <button id="speed">SPEED: 1×</button>
</div>

<div class="hint">
 Tap ground to build • Tap tower to upgrade • Waves can overlap
</div>

</div>

<div id="toast"></div>

<script>
const C=document.getElementById("c");
const x=C.getContext("2d");

let W=0,H=0;
let level=1;
let cash=300;
let life=20;

let enemies=[];
let towers=[];
let shots=[];
let particles=[];

let selected=null;
let mode="build";

let spawnQueue=[];
let activeWaves=0;
let wavesSent=0;

let autoWaves=true;
let autoTimer=5;
let gameSpeed=1;

let last=0;
let ended=false;

const $=id=>document.getElementById(id);

const worlds=[
 {name:"COUNTRYSIDE", ground:"#315c35", ground2:"#294e2e", road:"#756b55", edge:"#968a70", sky:"#b7d9a7"},
 {name:"DESERT", ground:"#9b713e", ground2:"#805b32", road:"#c39b63", edge:"#e2be82", sky:"#e4bc79"},
 {name:"URBAN", ground:"#41484e", ground2:"#343a40", road:"#676b70", edge:"#94999e", sky:"#73808a"},
 {name:"FOREST", ground:"#183d27", ground2:"#12321f", road:"#645b45", edge:"#81765a", sky:"#477a51"},
 {name:"SNOW", ground:"#b9ced4", ground2:"#9db8c0", road:"#77878d", edge:"#d9e7ea", sky:"#dcecf0"},
 {name:"INDUSTRIAL", ground:"#45423b", ground2:"#34322d", road:"#69645b", edge:"#928a7d", sky:"#796f60"},
 {name:"NIGHT WARFARE", ground:"#101a28", ground2:"#0b131e", road:"#303846", edge:"#4d596b", sky:"#182944"},
 {name:"WASTELAND", ground:"#654f3b", ground2:"#503c2e", road:"#81705c", edge:"#a18c72", sky:"#826d56"},
 {name:"ENEMY BASE", ground:"#292d31", ground2:"#1d2023", road:"#474c51", edge:"#7d2525", sky:"#542121"},
 {name:"FINAL BATTLEFIELD", ground:"#18191b", ground2:"#0d0e10", road:"#454545", edge:"#b02f2f", sky:"#391414"}
];

function worldIndex(){
 return Math.min(9,Math.floor((level-1)/10));
}

function world(){
 return worlds[worldIndex()];
}

function resize(){
 const r=C.getBoundingClientRect();
 const d=Math.min(devicePixelRatio||1,2);

 C.width=r.width*d;
 C.height=r.height*d;

 x.setTransform(d,0,0,d,0,0);

 W=r.width;
 H=r.height;
}

addEventListener("resize",resize);

function pathPoints(){
 return [
  [-20,H*.19],
  [W*.23,H*.19],
  [W*.23,H*.76],
  [W*.47,H*.76],
  [W*.47,H*.22],
  [W*.70,H*.22],
  [W*.70,H*.76],
  [W+25,H*.76]
 ];
}

function onPath(px,py){
 const pts=pathPoints();

 for(let i=0;i<pts.length-1;i++){
  const [x1,y1]=pts[i];
  const [x2,y2]=pts[i+1];

  const dx=x2-x1;
  const dy=y2-y1;
  const l2=dx*dx+dy*dy;

  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;
  t=Math.max(0,Math.min(1,t));

  const qx=x1+t*dx;
  const qy=y1+t*dy;

  if(Math.hypot(px-qx,py-qy)<38)return true;
 }

 return false;
}

function hud(){
 $("lvl").textContent=level;
 $("cash").textContent=Math.floor(cash);
 $("life").textContent=life;
 $("left").textContent=enemies.length+
  spawnQueue.reduce((n,w)=>n+w.remaining,0);

 $("waves").textContent=wavesSent;

 $("worldName").textContent=world().name;

 $("upgrade").textContent=
  selected ? `UPGRADE $${upgradeCost(selected)}` : "UPGRADE";

 $("auto").textContent=
  autoWaves ? "AUTO WAVES: ON" : "AUTO WAVES: OFF";

 $("auto").className=
  autoWaves ? "autoOn" : "autoOff";

 $("speed").textContent=`SPEED: ${gameSpeed}×`;
}

function toast(msg){
 const t=$("toast");
 t.textContent=msg;
 t.style.opacity=1;

 clearTimeout(t._timer);

 t._timer=setTimeout(()=>{
  t.style.opacity=0;
 },1100);
}

function tap(id,fn){
 $(id).addEventListener("pointerup",e=>{
  e.preventDefault();
  fn();
 });
}

tap("build",()=>{
 mode="build";
 selected=null;
 $("build").classList.add("sel");
 hud();
});

tap("upgrade",()=>{
 if(!selected)return toast("Tap a tower first");

 const cost=upgradeCost(selected);

 if(cash<cost)return toast("Need more cash");

 cash-=cost;
 selected.lv++;

 burst(selected.x,selected.y,"#f3c64d",14);

 toast(`Tower upgraded to Level ${selected.lv}`);
 hud();
});

tap("wave",()=>{
 sendWave(true);
});

tap("auto",()=>{
 autoWaves=!autoWaves;
 autoTimer=5;
 hud();

 toast(autoWaves?"Automatic waves enabled":"Automatic waves paused");
});

tap("speed",()=>{
 gameSpeed=gameSpeed===1?2:gameSpeed===2?3:1;
 hud();
});

function upgradeCost(t){
 return 65+t.lv*50;
}

C.addEventListener("pointerdown",e=>{
 if(ended)return;

 const r=C.getBoundingClientRect();

 const px=e.clientX-r.left;
 const py=e.clientY-r.top;

 const hit=towers.find(t=>
  Math.hypot(t.x-px,t.y-py)<28
 );

 if(hit){
  selected=hit;
  mode="select";
  $("build").classList.remove("sel");
  hud();
  return;
 }

 if(mode==="build"){
  if(onPath(px,py))
   return toast("Can't
